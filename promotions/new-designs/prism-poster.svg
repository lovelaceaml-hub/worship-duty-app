      <g transform="translate(34 602)">
        <rect width="722" height="1" fill="#edf0f6"/>
        <text x="0" y="23" font-size="8" font-weight="750" letter-spacing="1.2" fill="#3153ed">CALENDAR-FIRST CLARITY</text>
        <text x="722" y="23" text-anchor="end" font-size="8" font-weight="650" letter-spacing="1.1" fill="#7a869d">ONE APP · ONE LIVE SCHEDULE</text>
