        <text x="22" y="34" font-size="15" font-weight="700" fill="#172544">Month view</text>
        <g transform="translate(18 54)" font-size="8" font-weight="700" fill="#748097">
          <text x="20" y="12">SUN</text><text x="87" y="12">MON</text><text x="154" y="12">TUE</text><text x="221" y="12">WED</text><text x="288" y="12">THU</text><text x="355" y="12">FRI</text><text x="422" y="12">SAT</text>
        </g>
        <g transform="translate(16 77)">
          <rect width="468" height="255" rx="10" fill="#fbfcff"/>
          <g stroke="#edf0f6" stroke-width="1">
            <path d="M67 0V255M134 0V255M201 0V255M268 0V255M335 0V255M402 0V255"/>
            <path d="M0 64H468M0 128H468M0 192H468"/>
          </g>
          <rect x="201" y="64" width="67" height="64" fill="#3153ed"/>
          <g font-size="9" font-weight="650" fill="#5d6a83">
            <text x="11" y="18">30</text><text x="78" y="18">31</text><text x="145" y="18">1</text><text x="212" y="18">2</text><text x="279" y="18">3</text><text x="346" y="18">4</text><text x="413" y="18">5</text>
            <text x="11" y="82">6</text><text x="78" y="82">7</text><text x="145" y="82">8</text><text x="212" y="82" fill="#fff">9</text><text x="279" y="82">10</text><text x="346" y="82">11</text><text x="413" y="82">12</text>
            <text x="11" y="146">13</text><text x="78" y="146">14</text><text x="145" y="146">15</text><text x="212" y="146">16</text><text x="279" y="146">17</text><text x="346" y="146">18</text><text x="413" y="146">19</text>
            <text x="11" y="210">20</text><text x="78" y="210">21</text><text x="145" y="210">22</text><text x="212" y="210">23</text><text x="279" y="210">24</text><text x="346" y="210">25</text><text x="413" y="210">26</text>
          </g>
          <g fill="#dbe5ff">
            <rect x="143" y="94" width="44" height="9" rx="4"/><rect x="277" y="94" width="44" height="9" rx="4"/><rect x="344" y="158" width="44" height="9" rx="4"/>
          </g>
          <rect x="210" y="95" width="47" height="9" rx="4" fill="#ffffff" opacity=".45"/>
        </g>
      </g>

      <g transform="translate(554 232)">
        <rect width="202" height="350" rx="18" fill="#ffffff" stroke="#e3e8f1"/>
        <rect width="202" height="90" rx="18" fill="#eff3ff"/>
        <text x="18" y="27" font-size="8" font-weight="800" letter-spacing="1.3" fill="#596f95">SELECTED SERVICE</text>
        <text x="18" y="55" font-size="22" font-weight="700" fill="#26385d">Wed 9</text>
        <text x="18" y="73" font-size="9" fill="#64728c">Evening worship</text>
        <circle cx="171" cy="43" r="21" fill="#3153ed" opacity=".09"/>
        <text x="171" y="49" text-anchor="middle" font-size="17" font-weight="700" fill="#3153ed">9</text>

        <g transform="translate(16 111)">
          <rect width="170" height="43" rx="10" fill="#3153ed"/>
          <text x="85" y="27" text-anchor="middle" font-size="9" font-weight="750" fill="#fff">7:30 PM · SELECTED</text>
          <text x="0" y="79" font-size="9" font-weight="800" letter-spacing="1.1" fill="#596780">YOUR TEAM</text>
          <g transform="translate(0 94)" font-size="9" fill="#172544">
            <text y="0">Presider</text><text x="167" y="0" text-anchor="end" font-weight="700">James</text>
            <path d="M0 13H170" stroke="#edf0f6"/>
            <text y="36">Prayers</text><text x="167" y="36" text-anchor="end" font-weight="700">Anthony</text>
            <path d="M0 49H170" stroke="#edf0f6"/>
            <text y="72">Usher</text><text x="167" y="72" text-anchor="end" font-weight="700">Gabriel</text>
            <path d="M0 85H170" stroke="#edf0f6"/>
            <text y="108">Audio</text><text x="167" y="108" text-anchor="end" font-weight="700">Joshua</text>
          </g>
        </g>
