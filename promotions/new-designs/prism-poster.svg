        <text x="109" y="26" text-anchor="middle" font-size="8" font-weight="650" fill="#596780">My Duties</text>
        <text x="176" y="26" text-anchor="middle" font-size="8" font-weight="650" fill="#596780">Presider</text>
        <text x="244" y="26" text-anchor="middle" font-size="8" font-weight="650" fill="#596780">Manage</text>
