      <text x="34" y="171" font-size="35" font-weight="700" letter-spacing="-1.4" fill="#172544">September 2026</text>
      <text x="34" y="197" font-size="11" fill="#596780">Plan the month. Inspect each service without losing context.</text>

      <g transform="translate(34 232)">
