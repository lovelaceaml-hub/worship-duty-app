<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prism promotional poster for Worship Duties</title>
  <desc id="desc">Calendar-first Prism design promotional artwork in blue, white, and soft lavender.</desc>
  <defs>
    <linearGradient id="prismBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fd"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="prismAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3153ed"/>
      <stop offset="1" stop-color="#6374f4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#172544" flood-opacity=".13"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#prismBg)"/>
  <circle cx="1450" cy="45" r="255" fill="#3153ed" opacity=".045"/>
  <circle cx="1430" cy="110" r="170" fill="none" stroke="#3153ed" stroke-opacity=".09" stroke-width="2"/>
  <circle cx="230" cy="840" r="180" fill="#b1e3ea" opacity=".14" filter="url(#soft)"/>

  <g font-family="Inter, Avenir Next, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(92 72)">
      <rect width="52" height="52" rx="26" fill="#3153ed"/>
      <text x="26" y="33" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">LV</text>
      <circle cx="48" cy="48" r="8" fill="#b1e3ea" stroke="#fff" stroke-width="4"/>
      <text x="72" y="22" font-size="14" font-weight="800" letter-spacing="2.2" fill="#172544">LV ZION</text>
      <text x="72" y="42" font-size="10" font-weight="650" letter-spacing="2.3" fill="#596780">WORSHIP DUTIES</text>
    </g>

    <g transform="translate(92 235)">
      <rect width="150" height="34" rx="17" fill="#e3e9ff"/>
      <text x="75" y="22" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="1.8" fill="#3153ed">NEW APPEARANCE</text>
      <text x="0" y="111" font-size="94" font-weight="760" letter-spacing="-5" fill="#172544">PRISM</text>
      <text x="0" y="166" font-size="32" font-weight="650" fill="#3153ed">See the month.</text>
      <text x="0" y="207" font-size="32" font-weight="650" fill="#172544">Focus the service.</text>
      <text x="0" y="264" font-size="18" font-weight="450" fill="#596780">A crisp, calendar-first workspace built</text>
      <text x="0" y="293" font-size="18" font-weight="450" fill="#596780">for quick scanning and clear service details.</text>

      <g transform="translate(0 348)">
        <rect width="262" height="56" rx="14" fill="url(#prismAccent)"/>
        <text x="24" y="35" font-size="15" font-weight="750" fill="#fff">Appearance  →  Prism</text>
      </g>
      <text x="0" y="443" font-size="13" font-weight="700" letter-spacing="1.1" fill="#596780">SAME SCHEDULE · SAME DUTIES · SWITCH ANYTIME</text>
    </g>

    <g transform="translate(700 130)" filter="url(#shadow)">
      <rect width="790" height="640" rx="30" fill="#ffffff" stroke="#dfe5f1"/>
      <rect width="790" height="82" rx="30" fill="#ffffff"/>
      <path d="M0 82H790" stroke="#e3e8f1"/>

      <g transform="translate(28 22)">
        <circle cx="19" cy="19" r="19" fill="#3153ed"/>
        <text x="19" y="24" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">LV</text>
        <text x="53" y="16" font-size="10" font-weight="800" letter-spacing="1.4" fill="#172544">WORSHIP DUTIES</text>
        <text x="53" y="31" font-size="7" font-weight="650" letter-spacing="1.3" fill="#6b7890">PRISM WORKSPACE</text>
      </g>

