name: Prototype review
on:
  push:
    branches: [prototype/navy-cream]
  pull_request:
    branches: [main]
    paths: ['prototype/**', 'prototype.html', '.github/workflows/prototype-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check song-app.js
          if [ -d prototype ]; then find prototype -name '*.js' -exec node --check {} \;; fi
      - name: Package review source
        uses: actions/upload-artifact@v4
        with:
          name: prototype-review-source
          retention-days: 3
          path: |
            *.js
            *.css
            *.html
            package*.json
            tests/
            scripts/
            prototype/
            docs/
