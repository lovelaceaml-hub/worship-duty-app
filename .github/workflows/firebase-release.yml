# Full suites run only on manual dispatch with explicit approval for this run.
# Automatic runs retain focused checks; a generic release request is not full-suite approval.
name: Firebase release (Hosting only, live site)

# Publishes main to the live site https://lv-zion-duties.web.app through
# scripts/release.mjs live. Run only when Anthony says to release Worship Duty.
# It deploys Hosting only; Functions and Firestore rules go out through
# "Firebase backend release" (firebase-backend-release.yml, see README.md).

on:
  workflow_dispatch:
    inputs:
      full_suite_approved:
        description: "Anthony explicitly requested or just approved the full suite for this run"
        type: boolean
        default: false
      maintenance:
        description: Show the "being updated" screen (release again without it to end it)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: firebase-release
  cancel-in-progress: false

env:
  WDS_FIREBASE_TOOLS: firebase-tools@15

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run only from main. This run was started on $GITHUB_REF. Nothing deployed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: What is being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/firebase-release.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
          {
            echo "### Worship Duty release"
            echo ""
            echo "Releasing \`main\` at \`$GITHUB_SHA\`: $(git log -1 --format=%s "$GITHUB_SHA")"
            echo ""
            if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
              echo "Commits since the previous release run (\`${prev::7}\`):"
              echo ""
              git log --format='- `%h` %s' "$prev..$GITHUB_SHA"
            else
              echo "No earlier successful run of this workflow was found, so there is no commit list to compare against."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guard, release.mjs still builds only the pinned Hosting commands
        run: bash .github/scripts/deploy-guard.sh source

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pre-release checks (modules, rules including the Pacific next-service boundaries)
        run: |
          npm run check

      - name: Full unit and rules suite (explicit approval only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite_approved
        run: npm test
      - name: Pre-release checks (main flows and all four appearances, on fake data)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite_approved
        run: npm run test:browser

      - name: Write deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::The repository secret FIREBASE_SERVICE_ACCOUNT is not set, so nothing can be released."
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Preflight, the deploy account can see the ics function behind the /ics/** rewrite
        run: bash .github/scripts/deploy-guard.sh ics-preflight

      - name: Publish through release.mjs live (guarded, Hosting only)
        env:
          DEPLOY_GUARD_MODE: release
          MAINTENANCE: ${{ inputs.maintenance && '--maintenance' || '' }}
        run: |
          set -o pipefail
          export REAL_NPX="$(command -v npx)"
          chmod +x .github/scripts/npx-guard/npx
          # Keep the output: firebase-tools only warns if it cannot resolve the
          # ics function, and would then publish a broken /ics/** rewrite.
          rc=0
          PATH="$GITHUB_WORKSPACE/.github/scripts/npx-guard:$PATH" \
            node scripts/release.mjs live $MAINTENANCE 2>&1 | tee "$RUNNER_TEMP/deploy.log" || rc=$?
          bash .github/scripts/deploy-guard.sh release-result "$rc" "$RUNNER_TEMP/deploy.log"

      - name: Read-only check, the live calendar feed still answers
        run: bash .github/scripts/deploy-guard.sh ics-live

      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Report testing scope (authorization is not a pass)
        if: always()
        env:
          FULL_SUITE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite_approved }}
        run: |
          if [ "$FULL_SUITE_APPROVED" = "true" ]; then
            echo "### Full-suite mode explicitly authorized" >> "$GITHUB_STEP_SUMMARY"
            echo "Authorization is not a pass: inspect every suite step's outcome. Skipped or failed suites are not passes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Focused checks only: full suites NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "A successful job does not indicate a full-suite pass. Full suites require Anthony's explicit request or immediate approval for this run." >> "$GITHUB_STEP_SUMMARY"
          fi

