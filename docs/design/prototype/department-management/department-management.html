<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075f96">
  <title>Department Management Prototype</title>
  <link rel="stylesheet" href="department-management.css">
</head>
<body>
  <div id="prototype-root" class="prototype-root" data-appearance="classic" data-motion="full">
    <header class="topbar">
      <button class="brand-button" type="button" data-nav="manage" aria-label="Return to Manage">
        <span class="brand-mark" aria-hidden="true">LV</span>
        <span class="brand-copy"><span class="eyebrow">Fictional preview</span><span class="brand-title">Worship Service</span></span>
      </button>
      <div class="topbar-actions">
        <span class="prototype-pill">No network / no persistence</span>
        <button class="appearance-control" type="button" data-action="open-appearance" aria-label="Appearance. Current design: Original">Appearance</button>
        <button class="motion-control" type="button" data-action="toggle-motion" aria-pressed="false">Motion: on</button>
      </div>
    </header>

    <nav class="top-nav" aria-label="Primary navigation">
      <button type="button" data-nav="schedule">Schedule</button>
      <button type="button" data-nav="my">My Duties</button>
      <button type="button" data-nav="songs">Presider</button>
      <button type="button" data-nav="manage">Manage</button>
    </nav>

    <main id="prototype-main" tabindex="-1"></main>
    <p id="prototype-announcement" class="announcement" role="status" aria-live="polite"></p>

    <dialog id="appearance-dialog" class="appearance-dialog" aria-labelledby="appearance-title" aria-describedby="appearance-description">
      <div class="dialog-header">
        <div><span class="eyebrow">LV ZION / APPEARANCE</span><h2 id="appearance-title">Choose your design</h2></div>
        <button class="icon-button" type="button" data-action="close-appearance" aria-label="Close appearance chooser">Close</button>
      </div>
      <p id="appearance-description">One prototype, one department journey, four ways to view it. Appearance changes are local to this preview and never change the fictional records.</p>
      <div class="appearance-grid">
        <button class="appearance-tile" type="button" data-appearance="classic" aria-pressed="true">
          <span class="tile-preview tile-classic" aria-hidden="true"><i></i><b></b><em></em><em></em></span>
          <span><strong>Original</strong><small>Familiar blue service records</small></span><span class="tile-check" aria-hidden="true">Selected</span>
        </button>
        <button class="appearance-tile" type="button" data-appearance="prism" aria-pressed="false">
          <span class="tile-preview tile-prism" aria-hidden="true"><i></i><b></b><em></em><em></em></span>
          <span><strong>Prism</strong><small>Calendar-first, bright workspace</small></span><span class="tile-check" aria-hidden="true">Select</span>
        </button>
        <button class="appearance-tile" type="button" data-appearance="navy" aria-pressed="false">
          <span class="tile-preview tile-navy" aria-hidden="true"><i></i><b></b><em></em><em></em></span>
          <span><strong>Navy &amp; Cream</strong><small>Warm, refined service timeline</small></span><span class="tile-check" aria-hidden="true">Select</span>
        </button>
        <button class="appearance-tile" type="button" data-appearance="aurora" aria-pressed="false">
          <span class="tile-preview tile-aurora" aria-hidden="true"><i></i><b></b><em></em><em></em></span>
          <span><strong>Aurora</strong><small>Spacious, dynamic workspace</small></span><span class="tile-check" aria-hidden="true">Select</span>
        </button>
      </div>
      <div class="dialog-footer"><span>Your duties, permissions, and sample records stay unchanged.</span><button class="button button-subtle" type="button" data-action="close-appearance">Keep current design</button></div>
    </dialog>
  </div>
  <script src="department-management.js"></script>
</body>
</html>
