<!DOCTYPE html>
<html lang="en">
<head>

<title>LV Zion · Worship Service</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>

<style>
  :root {
    --brand-blue: #2383c6;
    --brand-blue-deep: #075f96;
    --brand-blue-dark: #174a6b;
    --brand-rose: #da0f47;
    --ink: #202428;
    --muted: #56616b;
    --faint: #6a747d;
    --canvas: #f3f6f8;
    --surface: #ffffff;
    --line: #d6e0e6;
    --hairline: #e6ecef;
    --accent: var(--brand-blue-deep);
    --accent-2: var(--brand-blue);
    --accent-grad: linear-gradient(135deg, var(--brand-blue-deep), var(--brand-blue));
    --accent-soft: #eaf5fb;
    --danger: #b80d3c;
    --ok: #16734c;
    --warn: #8a5a0a;
    --glass: var(--surface);
    --glass-strong: var(--surface);
    --glass-border: var(--line);
    --specular: none;
    --blur: none;
    --blur-lite: none;
    --shadow: 0 10px 28px rgba(23, 74, 107, 0.07);
    --shadow-soft: 0 4px 14px rgba(23, 74, 107, 0.06);
    --shadow-bar: 0 -8px 24px rgba(23, 74, 107, 0.10);
    --r-lg: 14px;
    --r-md: 10px;
    --sans: "Avenir Next", Avenir, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --gutter: 22px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); background: var(--canvas);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  body::before { content: ""; display: block; height: 5px; background: var(--brand-blue); }
  .maintenance-screen { min-height: calc(100vh - 5px); display: none; place-items: center; padding: 24px; }
  .maintenance-panel { width: min(100%, 520px); padding: 36px 28px; border: 1px solid var(--line); border-top: 5px solid var(--brand-blue); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); text-align: center; }
  .maintenance-kicker { margin-bottom: 8px; color: var(--brand-blue-deep); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .maintenance-panel h1 { margin: 0 0 12px; color: var(--brand-blue-dark); font-size: clamp(27px, 7vw, 38px); line-height: 1.12; }
  .maintenance-panel p { margin: 0 auto; max-width: 400px; color: var(--muted); font-size: 16px; }
  .maintenance-panel .maintenance-note { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--hairline); font-size: 14px; }
  html[data-maintenance="active"] body > .wrap { display: none; }
  html[data-maintenance="active"] body > .maintenance-screen { display: grid; }
  .maintenance-schedule { margin-top: 24px; text-align: left; }
  .maintenance-service { padding: 16px 0; border-top: 1px solid var(--hairline); }
  .maintenance-service:first-child { border-top: 0; }
  .maintenance-service-title { color: var(--brand-blue-dark); font-weight: 750; }
  .maintenance-service-time { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
  .maintenance-duty { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(100px, 1fr); gap: 12px; padding: 3px 0; font-size: 14px; }
  .maintenance-duty span:first-child { color: var(--muted); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 var(--gutter) 72px; }
  button, input, select, textarea { font: inherit; }
  button { touch-action: manipulation; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid rgba(35, 131, 198, 0.34); outline-offset: 2px;
  }

  header.app { display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: center; padding: 38px 2px 24px; border-bottom: 1px solid var(--line); }
  .header-home { grid-column: 1; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
  header.app .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--brand-blue-deep); }
  .header-home .app-title { display: block; margin: 0; font-weight: 650; font-size: clamp(28px, 5vw, 38px); letter-spacing: -0.025em; line-height: 1.12; color: var(--brand-blue-dark); }
  header.app .sub { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .sync-pill { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 650; box-shadow: var(--shadow-soft); }
  .sync-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .sync-pill.live { color: var(--ok); }
  .sync-pill.live::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(22,115,76,0.12); }

  nav.tabs { position: sticky; top: 0; z-index: 50; display: flex; margin: 0 0 22px; background: rgba(243,246,248,0.96); border-bottom: 1px solid var(--line); }
  nav.tabs button { flex: 1; position: relative; min-height: 54px; padding: 15px 8px 12px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); font-size: 14px; font-weight: 650; cursor: pointer; }
  nav.tabs button.active { color: var(--brand-blue-deep); border-bottom-color: var(--brand-blue); background: var(--surface); }
  nav.tabs button .dot { position: absolute; top: 11px; right: max(10px, calc(50% - 42px)); width: 7px; height: 7px; border-radius: 50%; background: var(--brand-rose); }
  nav.tabs.hidden, nav.tabs button.hidden { display: none; }

  .card { margin-bottom: 14px; padding: 19px 21px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
  #view { animation: enter 0.22s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .banner { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; padding: 12px 14px; border: 1px solid #bcd8e8; border-left: 4px solid var(--brand-blue); border-radius: var(--r-md); background: var(--accent-soft); font-size: 14px; }
  .banner.alert { border-color: #edc0ce; border-left-color: var(--brand-rose); background: #fff5f8; }
  .banner button.x { margin-left: auto; padding: 0 4px; border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .date-head { display: flex; align-items: center; gap: 12px; margin: 28px 2px 11px; }
  .date-head .day { color: var(--brand-blue-dark); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .date-head .badge { padding: 3px 9px; border-radius: 4px; background: var(--brand-blue-deep); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .card-head { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 0 11px; margin-bottom: 8px; border: 0; border-bottom: 1px solid var(--hairline); background: none; color: inherit; text-align: left; cursor: pointer; }
  .card-head .svc-title { color: var(--brand-blue-dark); font-size: 17px; font-weight: 700; }
  .card-head .svc-title small, .card-head .time, .choir-song { color: var(--muted); font-size: 13px; font-weight: 500; }
  .card-head .time { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dot-c { display: inline-block; flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; }
  .cat-label, .cat-edit-label { display: flex; align-items: center; gap: 9px; margin: 15px 0 4px; color: var(--faint); font-size: 11px; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
  .duty-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0 4px 17px; font-size: 15px; }
  .duty-row .dname { flex: 0 0 128px; color: var(--muted); font-size: 13px; }
  .duty-row .pill { color: var(--ink); font-weight: 650; }
  .duty-row .pill.me { padding: 2px 9px; border-radius: 4px; background: var(--accent-soft); color: var(--brand-blue-deep); }
  .conflict-note { display:flex; align-items:center; gap:9px; margin:10px 0 2px; color:var(--warn); font-size:13px; font-weight:650; }
  .conflict-note .linkish { padding: 0; font-size: 13px; }
  .conflict-note.ok { color: var(--muted); font-weight: 500; }
  select.conflict { border-color: #bd8a34; box-shadow: 0 0 0 3px rgba(138,90,10,0.10); }
  .warn-badge { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; margin-left:7px; border-radius:50%; background:var(--brand-rose); color:#fff; font-size:11px; font-weight:800; line-height:1; vertical-align:middle; }
  .warn-badge.ok { background:var(--warn); }
  .empty { padding: 50px 20px; color: var(--muted); text-align: center; font-size: 15px; }

  .linkish { padding: 8px 0; border: 0; background: none; color: var(--brand-blue-deep); font-size: 15px; font-weight: 650; cursor: pointer; }
  .hint { margin: 6px 2px 16px; color: var(--muted); font-size: 13px; }
  select, input[type=text], input[type=password], input[type=date], input[type=time] { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #b8c7d0; border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
  select:focus, input:focus { border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(35,131,198,0.16); }
  .me-picker { margin: 18px 0 16px; }
  .me-picker label { display: block; margin-bottom: 8px; color: var(--brand-blue-dark); font-size: 16px; font-weight: 700; }
  .notify-box, .req-actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .notify-help summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
  .notify-help p { margin: 0 0 8px; }
  button.primary, button.ghost { min-height: 44px; padding: 10px 17px; border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .12s, background .15s; }
  button.primary { border: 1px solid var(--brand-blue-deep); background: var(--brand-blue-deep); color: #fff; box-shadow: 0 5px 12px rgba(7,95,150,0.17); }
  button.ghost { border: 1px solid #a9c7d9; background: var(--surface); color: var(--brand-blue-deep); }
  button.primary:active, button.ghost:active { transform: translateY(1px); }
  button.ghost.on { border-color: #8ec3ab; color: var(--ok); }
  button.danger-link { padding: 6px; border: 0; background: none; color: var(--danger); font-size: 13px; font-weight: 650; cursor: pointer; }
  button.mini { min-height: 44px; padding: 7px 10px; font-size: 13px; }

  .duty-card { position: relative; overflow: hidden; }
  .duty-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--edge, var(--brand-blue)); }
  .duty-card .when { margin-bottom: 2px; color: var(--muted); font-size: 13px; }
  .duty-card .what { color: var(--brand-blue-dark); font-size: 17px; font-weight: 700; }
  .duty-card .role { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin-top: 6px; font-size: 15px; font-weight: 650; }
  .duty-card .role .rname { flex: 1 1 auto; min-width: 92px; }
  .duty-card .role .req-change { padding: 2px 0; white-space: nowrap; font-size: 12.5px; }
  .duty-card .svc-sep, .duty-expand, .req-form { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hairline); }
  .song-tag { padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--brand-blue-deep); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .song-tag.done { background: #e6f4ec; color: var(--ok); }
  .alerts-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .alerts-head .alerts-clear { padding: 0; min-height: 32px; font-size: 13px; }
  .alert-item, .req-item { padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .alert-item { display: flex; gap: 10px; align-items: baseline; }
  .alert-item:last-child, .req-item:last-child { border-bottom: 0; }
  .alert-item .t, .req-item .req-meta { color: var(--faint); font-size: 11px; }
  .req-pending-tag { color: var(--muted); font-size: 12px; font-style: italic; }
  .req-form textarea { width: 100%; min-height: 76px; padding: 10px 12px; resize: vertical; border: 1px solid #b8c7d0; border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px; outline: none; }
  .req-form textarea:focus { border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(35,131,198,0.16); }
  .req-form .req-actions { display: flex; gap: 8px; margin-top: 8px; }
  .status-chip { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .status-chip.pending { background: #fff7e7; color: var(--warn); }
  .status-chip.approved { background: #edf8f2; color: var(--ok); }
  .status-chip.declined { background: #fff1f5; color: var(--danger); }
  .req-item .req-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .req-item .req-when { font-weight: 650; }
  .req-item .req-note { margin-top: 4px; color: var(--muted); }

  .subnav { display: flex; gap: 7px; margin: 18px 0; flex-wrap: wrap; align-items: center; }
  .subnav button { min-height: 44px; padding: 8px 13px; border: 1px solid #b8c7d0; border-radius: 7px; background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 650; cursor: pointer; }
  .subnav button.active { border-color: var(--brand-blue-deep); background: var(--brand-blue-deep); color: #fff; }
  .subnav .lock-btn { margin-left: auto; }
  form.add-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  form.add-row input, form.add-row select { flex: 1; min-width: 105px; }
  .edit-grid { display: grid; grid-template-columns: 132px 1fr; gap: 8px 12px; align-items: center; margin: 8px 0; }
  .edit-grid .lab { color: var(--muted); text-align: right; font-size: 13px; }
  .edit-grid select, .edit-grid input { min-height: 40px; padding: 8px 10px; font-size: 14px; }
  .list-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .list-row input[type=text] { min-height: 36px; padding: 4px 2px; border: 0; background: none; font-size: 15px; font-weight: 650; }
  .list-row .count { color: var(--faint); white-space: nowrap; font-size: 12px; }
  .role-assignment { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; padding: 5px 0; border-bottom: 1px solid var(--hairline); }
  .role-assignment:last-of-type { border-bottom: 0; }
  .role-add { margin-top: 12px; margin-bottom: 0; }
  .data-actions .card p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
  .data-actions .card p b { color: var(--ink); }
  code.cfg { display: block; overflow-x: auto; padding: 8px 10px; border-radius: 6px; background: #edf2f5; font-size: 12px; }
  .sync-status, .sync-warnings { color: var(--muted); font-size: 13px; }
  .sync-warnings { margin: 4px 0 0; padding-left: 18px; }
  .plan-conflict { padding: 12px 0 6px; border-top: 1px solid var(--line); }
  .plan-conflict:first-of-type { border-top: 0; }
  .plan-when { margin-bottom: 6px; font-size: 14px; }
  .plan-duties { color: var(--muted); font-size: 13px; }
  .plan-suggest { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 4px 0; font-size: 13px; }
  .plan-suggest .lab { min-width: 110px; color: var(--muted); }
  .plan-scroll { overflow-x: auto; margin-top: 10px; }
  .plan-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .plan-table th, .plan-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
  .plan-table th, .plan-table tr.plan-idle td { color: var(--muted); }

  .lock-box { max-width: 480px; margin: 38px auto 0; padding: 34px 28px; text-align: center; border-top: 4px solid var(--brand-blue); }
  .lock-title { margin-bottom: 3px; color: var(--brand-blue-dark); font-size: 22px; font-weight: 700; }
  .lock-box .hint { max-width: 380px; margin: 6px auto 18px; }
  .lock-box form { justify-content: center; max-width: 360px; margin: 0 auto; }
  .pin-error { margin: 10px 0 0; color: var(--danger); font-size: 13px; font-weight: 650; }
  .feature-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px; }
  .f-label { font-size: 15px; font-weight: 650; }
  .f-desc { margin-top: 1px; color: var(--muted); font-size: 13px; }
  .switch { position: relative; flex: 0 0 auto; display: inline-block; width: 48px; height: 28px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: #aeb9c0; transition: background .2s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.24); transition: transform .2s; }
  .switch input:checked + .track { background: var(--brand-blue-deep); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 3px solid rgba(35,131,198,0.42); outline-offset: 3px; }

  .song-head { margin: 14px 0 2px; }
  .song-head .ghost { min-height: 38px; padding: 7px 13px; font-size: 13px; }
  .department-eyebrow { color: var(--brand-blue-deep); font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
  .department-scope h2, .department-hero h2, .department-profile-hero h2 { margin: 3px 0 4px; color: var(--brand-blue-dark); font-size: 28px; letter-spacing: -.025em; }
  .department-security-note, .department-profile-note, .department-attribution, .department-uid { color: var(--muted); font-size: 13px; }
  .department-security-note { margin: 0; padding: 11px 13px; border-left: 3px solid var(--brand-blue); background: var(--accent-soft); }
  .department-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .department-card { display: flex; min-height: 220px; flex-direction: column; margin: 0; padding: 18px; }
  .department-card-top { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .department-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brand-blue); box-shadow: 0 0 0 4px var(--accent-soft); }
  .department-card h3 { margin: 18px 0 4px; color: var(--brand-blue-dark); font-size: 21px; }
  .department-card-copy { margin: 0 0 13px; color: var(--muted); font-size: 13px; }
  .department-card-leader { min-height: 42px; margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .department-card-leader strong { display: block; color: var(--ink); font-size: 12px; }
  .department-card .primary { align-self: flex-start; margin-top: auto; }
  .department-back { margin: 0 0 8px 2px; }
  .department-loading, .department-error { text-align: center; }
  .department-loading h2, .department-error h2 { margin: 5px 0; color: var(--brand-blue-dark); font-size: 21px; }
  .department-spinner { display: inline-block; width: 24px; height: 24px; margin: 6px auto; border: 3px solid var(--line); border-top-color: var(--brand-blue); border-radius: 50%; animation: department-spin .8s linear infinite; }
  @keyframes department-spin { to { transform: rotate(360deg); } }
  .department-leader-strip { display: flex; flex-wrap: wrap; gap: 9px; align-items: baseline; margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); font-size: 13px; }
  .department-leader-strip strong { color: var(--brand-blue-dark); }
  .department-roster-groups { display: grid; gap: 14px; }
  .department-group { padding: 4px 0; }
  .department-group-heading, .department-section-heading, .department-profile-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .department-group-heading { margin: 22px 2px 8px; }
  .department-group-heading h3, .department-editor h3, .department-add-form h3, .department-history h3, .department-attribution-card h3 { margin: 0; color: var(--brand-blue-dark); font-size: 17px; }
  .department-group-heading > span, .department-editor-state { min-width: 26px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--brand-blue-deep); font-size: 12px; font-weight: 750; text-align: center; }
  .department-member-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 13px 14px; border: 1px solid var(--line); border-bottom: 0; background: var(--surface); }
  .department-member-row:first-of-type { border-radius: 9px 9px 0 0; }
  .department-member-row:last-of-type { border-bottom: 1px solid var(--line); border-radius: 0 0 9px 9px; }
