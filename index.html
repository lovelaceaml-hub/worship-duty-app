<link rel="preconnect" href="https://www.gstatic.com" crossorigin>

<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>

<div class="app-shell">
<div class="wrap">
  <header class="app topbar">
    <button class="header-home brand" data-act="home" aria-label="Return to Home">
      <span class="eyebrow">Las Vegas Zion</span>
      <span class="app-title">Worship Service</span>
    </button>
    <h1 class="sr-only">LV Zion Worship Service</h1>
    <div class="sub">
      <div id="header-member-control" role="group" aria-label="Member and theme settings"></div>
      <span id="sync-pill" class="sync-pill">This device only</span>
    </div>
  </header>

  <nav class="tabs primary-nav" aria-label="Primary navigation">
    <button data-act="tab" data-tab="schedule">Home</button>
    <button data-act="tab" data-tab="my" id="tab-my">My Duties</button>
    <button data-act="tab" data-tab="songs" id="tab-presider" class="hidden">Presider</button>
    <button data-act="tab" data-tab="manage" id="tab-manage">Manage</button>
  </nav>

  <div id="banners" aria-live="polite"></div>
  <main id="view"></main>
</div>
