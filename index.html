<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f2ee">
<title>LV Zion · Worship Duty Schedule</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #211d19;
    --muted: #837c73;
    --faint: #a8a199;
    --line: rgba(33, 29, 25, 0.08);
    --hairline: rgba(33, 29, 25, 0.06);
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --accent-grad: linear-gradient(135deg, #4f46e5, #7c3aed);
    --accent-soft: rgba(79, 70, 229, 0.09);
    --danger: #b3261e;
    --ok: #1a7f5c;
    --glass: linear-gradient(150deg, rgba(255,255,255,0.78), rgba(255,255,255,0.42));
    --glass-strong: rgba(255, 255, 255, 0.82);
    --glass-border: rgba(255, 255, 255, 0.72);
    --shadow: 0 1px 2px rgba(33,29,25,0.04), 0 24px 48px -24px rgba(79,70,229,0.18);
    --shadow-soft: 0 1px 2px rgba(33,29,25,0.03), 0 12px 28px -18px rgba(33,29,25,0.18);
    --r-lg: 22px;
    --r-md: 14px;
    --serif: "Fraunces", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(720px 480px at 12% -4%, rgba(99, 102, 241, 0.20), transparent 62%),
      radial-gradient(560px 420px at 96% 12%, rgba(244, 163, 96, 0.17), transparent 60%),
      radial-gradient(660px 520px at 30% 108%, rgba(45, 180, 140, 0.13), transparent 62%),
      radial-gradient(520px 420px at 78% 92%, rgba(199, 120, 221, 0.10), transparent 60%),
      #f4f2ee;
    background-attachment: fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 0 18px 72px; }

  /* ---------- header ---------- */
  header.app { text-align: center; padding: 40px 10px 6px; }
  header.app .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--faint);
  }
  header.app h1 {
    margin: 6px 0 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  header.app .sub { margin: 14px 0 0; display: flex; justify-content: center; }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--glass-border);
    background: var(--glass-strong);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 999px; padding: 4px 13px;
    box-shadow: var(--shadow-soft);
  }
  .sync-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .sync-pill.live { color: var(--ok); }
  .sync-pill.live::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(26,127,92,0.15); }

  /* ---------- tabs ---------- */
  nav.tabs {
    position: sticky; top: 10px; z-index: 20;
    display: flex; gap: 2px;
    margin: 22px 0 4px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: var(--shadow-soft);
  }
  nav.tabs button {
    flex: 1; position: relative;
    border: none; background: transparent;
    border-radius: 999px;
    padding: 10px 4px; font-size: 14px; font-weight: 600;
    font-family: var(--sans);
    color: var(--muted); cursor: pointer;
    transition: color 0.2s ease;
  }
  nav.tabs button.active {
    background: var(--glass-strong);
    color: var(--ink);
    box-shadow: 0 2px 10px -2px rgba(33,29,25,0.18);
  }
  nav.tabs button .dot {
    position: absolute; top: 8px; right: 14px; width: 7px; height: 7px;
    background: var(--accent-grad); border-radius: 50%;
  }

  /* ---------- shared surfaces ---------- */
  .card {
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    padding: 18px 22px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  #view { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .banner {
    background: var(--glass-strong);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-md); padding: 12px 16px; font-size: 13.5px; margin: 14px 0 0;
    display: flex; gap: 10px; align-items: flex-start;
    box-shadow: var(--shadow-soft);
  }
  .banner.alert { border-left-color: var(--danger); }
  .banner button.x { margin-left: auto; border: none; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 0 2px; }

  .date-head { margin: 30px 4px 12px; display: flex; align-items: center; gap: 12px; }
  .date-head .day {
    font-family: var(--serif); font-weight: 600; font-size: 19px;
    letter-spacing: 0; color: var(--ink);
  }
  .date-head .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: #fff; background: var(--accent-grad);
    padding: 3px 10px; border-radius: 999px;
    box-shadow: 0 4px 12px -4px rgba(79,70,229,0.5);
  }

  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--hairline); }
  .card-head .svc-title { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .card-head .svc-title small { font-family: var(--sans); color: var(--muted); font-weight: 500; font-size: 13px; }
  .card-head .time { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .choir-song { font-size: 13px; color: var(--muted); padding: 3px 0 6px; font-style: italic; font-family: var(--serif); }

  .dot-c { display: inline-block; flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,255,255,0.55); }

  .cat-label { display: flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin: 13px 0 3px; }
  .duty-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0 3px 17px; font-size: 14px; }
  .duty-row .dname { flex: 0 0 128px; color: var(--muted); font-size: 13px; }
  .duty-row .pill { font-weight: 600; color: var(--ink); }
  .duty-row .pill.me {
    background: var(--accent-grad); color: #fff;
    border-radius: 999px; padding: 2px 11px;
    box-shadow: 0 4px 12px -4px rgba(79,70,229,0.55);
  }

  .empty { text-align: center; color: var(--muted); padding: 52px 20px; font-size: 14px; }
  .linkish { background: none; border: none; color: var(--accent); font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 8px 0; font-family: var(--sans); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 2px 16px; }

  select, input[type=text], input[type=password], input[type=date], input[type=time] {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 15px; font-family: var(--sans);
    background: var(--glass-strong); color: var(--ink);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  select:focus, input:focus { border-color: rgba(79,70,229,0.5); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }

  .me-picker { margin: 18px 0 16px; }
  .me-picker label { display: block; font-family: var(--serif); font-weight: 600; font-size: 17px; margin-bottom: 8px; }

  .notify-box { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button.primary {
    background: var(--accent-grad); color: #fff;
    border: none; border-radius: 12px; padding: 11px 18px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: var(--sans);
    box-shadow: 0 8px 20px -8px rgba(79,70,229,0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.primary:active { transform: scale(0.98); }
  button.ghost {
    background: var(--glass-strong); color: var(--ink);
    border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px 16px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: var(--sans);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow-soft);
  }
  button.ghost.on { border-color: rgba(26,127,92,0.4); color: var(--ok); }
  button.danger-link { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; font-family: var(--sans); }

  .duty-card { position: relative; overflow: hidden; }
  .duty-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--edge, var(--accent));
    border-radius: 4px 0 0 4px;
  }
  .duty-card .when { color: var(--muted); font-size: 12.5px; margin-bottom: 2px; }
  .duty-card .what { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .duty-card .role { display: flex; align-items: center; gap: 9px; margin-top: 6px; font-size: 14px; font-weight: 600; }
  .duty-expand { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 5px; }

  .alert-item { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--hairline); }
  .alert-item:last-child { border-bottom: none; }
  .alert-item .t { color: var(--faint); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- manage ---------- */
  .subnav { display: flex; gap: 6px; margin: 18px 0; flex-wrap: wrap; align-items: center; }
  .subnav button {
    border: 1px solid var(--glass-border); background: var(--glass-strong);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 600;
    color: var(--muted); cursor: pointer; font-family: var(--sans);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .subnav button.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .subnav .lock-btn { margin-left: auto; }

  form.add-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  form.add-row input, form.add-row select { flex: 1; min-width: 105px; }

  .edit-grid { display: grid; grid-template-columns: 132px 1fr; gap: 7px 12px; align-items: center; margin: 8px 0; }
  .edit-grid .lab { font-size: 12.5px; color: var(--muted); text-align: right; }
  .edit-grid select, .edit-grid input { padding: 8px 11px; font-size: 14px; border-radius: 10px; }
  .cat-edit-label { display: flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin: 18px 0 4px; }

  .list-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: var(--r-md); padding: 9px 14px; margin-bottom: 8px;
    box-shadow: var(--shadow-soft);
  }
  .list-row input[type=text] { border: none; background: none; padding: 4px 2px; font-weight: 600; font-size: 14px; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .list-row input[type=text]:focus { box-shadow: none; outline: 1px solid rgba(79,70,229,0.4); border-radius: 6px; }
  .list-row .count { color: var(--faint); font-size: 12px; white-space: nowrap; }

  .data-actions .card p { margin: 0 0 10px; font-size: 13.5px; color: var(--muted); }
  .data-actions .card p b { color: var(--ink); }
  code.cfg { display: block; background: rgba(33,29,25,0.05); border-radius: 10px; padding: 8px 12px; font-size: 12px; overflow-x: auto; }

  /* ---------- lock screen ---------- */
  .lock-box { text-align: center; padding: 34px 26px; margin-top: 22px; }
  .lock-title { font-family: var(--serif); font-size: 21px; font-weight: 600; margin-bottom: 2px; }
  .lock-box .hint { margin: 6px auto 18px; max-width: 380px; }
  .lock-box form { justify-content: center; max-width: 360px; margin: 0 auto; }
  .pin-error { color: var(--danger); font-size: 13px; font-weight: 600; margin: 10px 0 0; }

  /* ---------- feature toggles ---------- */
  .feature-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 20px; }
  .f-label { font-weight: 600; font-size: 14px; }
  .f-desc { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .switch { position: relative; flex: 0 0 auto; display: inline-block; width: 46px; height: 27px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(33,29,25,0.14);
    transition: background 0.2s ease;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(33,29,25,0.25);
    transition: transform 0.2s ease;
  }
  .switch input:checked + .track { background: var(--accent-grad); }
  .switch input:checked + .track::after { transform: translateX(19px); }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="eyebrow">Las Vegas Zion</div>
    <h1>Worship Duty Schedule</h1>
    <div class="sub"><span id="sync-pill" class="sync-pill">This device only</span></div>
  </header>

  <nav class="tabs">
    <button data-act="tab" data-tab="schedule">Schedule</button>
    <button data-act="tab" data-tab="my" id="tab-my">My Duties</button>
    <button data-act="tab" data-tab="manage">Manage</button>
  </nav>

  <div id="banners"></div>
  <main id="view"></main>
</div>
<script src="seed-data.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
