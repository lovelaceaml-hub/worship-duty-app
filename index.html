<!DOCTYPE html>
<html lang="en" data-appearance="prism">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3348e3">
<title>LV Zion · Worship Service</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles/base.css?v=DEV">
<link rel="stylesheet" href="styles/prism.css?v=DEV">
</head>
<body>
<div class="app">
  <header class="header">
    <button type="button" class="brand" data-act="home" aria-label="Go to the schedule">
      <span class="brand-mark" aria-hidden="true">LV</span>
      <span class="brand-text"><span class="brand-name">LV ZION</span><span class="brand-screen" data-slot="screen">Worship Duty</span></span>
    </button>
    <h1 class="sr-only">LV Zion Worship Service</h1>
    <span class="sync-status" data-slot="sync" role="status">Offline</span>
    <div class="header-tools">
      <div class="account">
        <button type="button" class="account-chip" data-slot="member" aria-haspopup="menu" aria-expanded="false" hidden>
          <span class="account-initials" data-slot="initials" aria-hidden="true"></span>
          <span class="account-name" data-slot="person"></span>
          <span class="account-caret" aria-hidden="true">&#8964;</span>
        </button>
        <div class="account-menu" data-slot="menu" role="menu" aria-label="Your account" hidden>
          <p class="account-who" data-slot="person" aria-hidden="true"></p>
          <button type="button" role="menuitem" data-act="account" data-view="availability">Availability</button>
          <button type="button" role="menuitem" data-act="account" data-view="settings">Settings</button>
          <button type="button" role="menuitem" data-act="view-as-menu" data-slot="view-as" hidden>View as someone</button>
          <button type="button" role="menuitem" class="account-feedback" data-act="feedback-open">Feedback about the app</button>
          <button type="button" role="menuitem" class="account-sign-out" data-act="sign-out">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="Main" hidden>
    <button type="button" class="tab" data-act="tab" data-tab="schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2"/></svg>
      <span class="tab-label">Schedule</span><span class="tab-dot" hidden></span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="my">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2m-7 9 2 2 5-5"/></svg>
      <span class="tab-label">My Duties</span><span class="tab-dot is-new" hidden></span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="songs" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-3v13M9 9l12-3"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="18" cy="15" rx="3" ry="2"/></svg>
      <span class="tab-label">Presider</span><span class="tab-dot" hidden></span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="manage" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h5m4 0h9M3 12h11m4 0h3M3 18h2m4 0h12"/><circle cx="10" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg>
      <span class="tab-label">Manage</span><span class="tab-dot" hidden></span>
    </button>
  </nav>

  <div id="banners" aria-live="polite"></div>
  <main id="view"></main>
  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
</div>
<script src="permissions.js?v=DEV"></script>
<script src="firebase-config.js?v=DEV"></script>
<script type="module" src="app/main.js?v=DEV"></script>
</body>
</html>
