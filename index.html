<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef1f7">
<title>LV Zion · Worship Duty Schedule</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root {
    /* ---- ink & text ---- */
    --ink: #1c1c1e;                       /* iOS label */
    --muted: #52525b;                     /* secondary label (>=4.5:1 on glass) */
    --faint: #6b6b73;                     /* tertiary / footnote label */
    --line: rgba(60, 60, 67, 0.18);       /* iOS separator (opaque-ish) */
    --hairline: rgba(60, 60, 67, 0.12);   /* iOS hairline separator */

    /* ---- iOS system tint (blue-leaning indigo) ---- */
    --accent: #3b5bdb;
    --accent-2: #4f6ef2;
    --accent-grad: linear-gradient(180deg, #4f6ef2, #3b5bdb);
    --accent-soft: rgba(59, 91, 219, 0.10);

    /* ---- semantic ---- */
    --danger: #d1332b;
    --ok: #12855f;
    --warn: #ad6a12;

    /* ---- liquid glass surfaces ---- */
    --glass: linear-gradient(155deg, rgba(255,255,255,0.62), rgba(255,255,255,0.30));
    --glass-strong: rgba(255, 255, 255, 0.68);
    --glass-border: rgba(255, 255, 255, 0.55);
    --specular: inset 0 1px 0 rgba(255,255,255,0.60);
    --blur: saturate(180%) blur(30px);
    --blur-lite: saturate(160%) blur(18px);

    /* ---- elevation ---- */
    --shadow: 0 1px 1px rgba(28,28,30,0.04), 0 18px 40px -20px rgba(28,28,30,0.28);
    --shadow-soft: 0 1px 1px rgba(28,28,30,0.03), 0 8px 22px -14px rgba(28,28,30,0.22);
    --shadow-bar: 0 8px 30px -8px rgba(28,28,30,0.22), 0 2px 8px rgba(28,28,30,0.08);

    /* ---- continuous-feel radii ---- */
    --r-lg: 26px;
    --r-md: 16px;

    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.47;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background:
      radial-gradient(760px 520px at 8% -6%, rgba(99, 126, 234, 0.16), transparent 60%),
      radial-gradient(620px 460px at 98% 6%, rgba(126, 158, 232, 0.13), transparent 58%),
      radial-gradient(680px 560px at 26% 106%, rgba(120, 196, 214, 0.11), transparent 60%),
      radial-gradient(560px 460px at 82% 96%, rgba(158, 148, 224, 0.09), transparent 58%),
      #eef1f7;
    background-attachment: fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 0 18px 72px; }

  /* ---------- header ---------- */
  header.app { text-align: center; padding: 44px 10px 6px; }
  header.app .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.10em;
    text-transform: uppercase; color: var(--faint);
  }
  header.app h1 {
    margin: 5px 0 0;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.021em;
    line-height: 1.08;
  }
  header.app .sub { margin: 15px 0 0; display: flex; justify-content: center; }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--glass-border);
    background: var(--glass-strong);
    backdrop-filter: var(--blur-lite); -webkit-backdrop-filter: var(--blur-lite);
    border-radius: 999px; padding: 5px 14px;
    box-shadow: var(--shadow-soft), var(--specular);
  }
  .sync-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .sync-pill.live { color: var(--ok); }
  .sync-pill.live::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(18,133,95,0.16); }

  /* ---------- tabs (desktop = top pill bar) ---------- */
  nav.tabs {
    position: sticky; top: 10px; z-index: 50;
    display: flex; gap: 3px;
    margin: 24px 0 4px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.42);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: var(--shadow-soft), var(--specular);
  }
  nav.tabs button {
    flex: 1; position: relative;
    border: none; background: transparent;
    border-radius: 999px;
    padding: 9px 4px; font-size: 15px; font-weight: 600;
    letter-spacing: -0.01em;
    font-family: var(--sans);
    color: var(--muted); cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }
  nav.tabs button.active {
    background: var(--glass-strong);
    color: var(--accent);
    box-shadow: 0 2px 8px -2px rgba(28,28,30,0.20), var(--specular);
  }
  nav.tabs button .dot {
    position: absolute; top: 7px; right: 16px; width: 7px; height: 7px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.7);
  }
  nav.tabs.hidden { display: none; }

  /* ---------- shared surfaces ---------- */
  .card {
    background: var(--glass);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    padding: 18px 22px;
    margin-bottom: 14px;
    box-shadow: var(--shadow), var(--specular);
  }
  #view { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .banner {
    background: var(--glass-strong);
    backdrop-filter: var(--blur-lite); -webkit-backdrop-filter: var(--blur-lite);
    border: 1px solid var(--glass-border);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-md); padding: 12px 16px; font-size: 15px; margin: 14px 0 0;
    display: flex; gap: 10px; align-items: flex-start;
    box-shadow: var(--shadow-soft), var(--specular);
  }
  .banner.alert { border-left-color: var(--danger); }
  .banner button.x { margin-left: auto; border: none; background: none; color: var(--muted); font-size: 17px; cursor: pointer; padding: 0 2px; }

  .date-head { margin: 30px 4px 12px; display: flex; align-items: center; gap: 12px; }
  .date-head .day {
    font-weight: 700; font-size: 20px;
    letter-spacing: -0.015em; color: var(--ink);
  }
  .date-head .badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;
    color: #fff; background: var(--accent-grad);
    padding: 3px 10px; border-radius: 999px;
    box-shadow: 0 4px 12px -4px rgba(59,91,219,0.5), inset 0 1px 0 rgba(255,255,255,0.35);
  }

  .card-head { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 0 10px; margin-bottom: 8px; border: none; border-bottom: 1px solid var(--hairline); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .card-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .card-head .svc-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .card-head .svc-title small { color: var(--muted); font-weight: 500; font-size: 13px; letter-spacing: 0; }
  .card-head .time { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .choir-song { font-size: 13px; color: var(--muted); padding: 3px 0 6px; }

  .dot-c { display: inline-block; flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,255,255,0.6); }

  .cat-label { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin: 14px 0 3px; }
  .conflict-note { display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; color:var(--warn); margin:10px 0 2px; }
  .conflict-note .linkish { padding: 0; font-size: 13px; }
  .conflict-note.ok { color: var(--muted); font-weight: 500; }
  select.conflict { border-color: rgba(173,106,18,0.55); box-shadow: 0 0 0 3px rgba(173,106,18,0.10); }
  .warn-badge { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-left:7px; border-radius:50%; background:var(--danger); color:#fff; font-size:11px; font-weight:800; line-height:1; vertical-align:middle; flex:0 0 auto; }
  .warn-badge.ok { background:var(--warn); }
  .duty-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0 4px 17px; font-size: 15px; }
  .duty-row .dname { flex: 0 0 128px; color: var(--muted); font-size: 13px; }
  .duty-row .pill { font-weight: 600; color: var(--ink); }
  .duty-row .pill.me {
    background: var(--accent-grad); color: #fff;
    border-radius: 999px; padding: 2px 12px;
    box-shadow: 0 4px 12px -4px rgba(59,91,219,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .empty { text-align: center; color: var(--muted); padding: 52px 20px; font-size: 15px; }

  /* Manage → Planning (coordinator view) */
  .plan-conflict { border-top: 1px solid var(--line); padding: 12px 0 6px; }
  .plan-conflict:first-of-type { border-top: none; }
  .plan-when { font-size: 14px; margin-bottom: 6px; }
  .plan-duties { color: var(--muted); font-size: 13px; }
  .plan-suggest { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 4px 0; font-size: 13px; }
  .plan-suggest .lab { color: var(--muted); min-width: 110px; }
  button.mini { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .plan-scroll { overflow-x: auto; margin-top: 10px; }
  .plan-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .plan-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .plan-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .plan-table tr.plan-idle td { color: var(--muted); }
  .linkish { background: none; border: none; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 0; font-family: var(--sans); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 2px 16px; }

  select, input[type=text], input[type=password], input[type=date], input[type=time] {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 13px;
    font-size: 17px; font-family: var(--sans);
    background: var(--glass-strong); color: var(--ink);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  select:focus, input:focus { border-color: rgba(59,91,219,0.5); box-shadow: 0 0 0 3px rgba(59,91,219,0.14); }

  .me-picker { margin: 18px 0 16px; }
  .me-picker label { display: block; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 8px; }

  .notify-box { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button.primary {
    background: var(--accent-grad); color: #fff;
    border: none; border-radius: 999px; padding: 11px 20px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--sans);
    box-shadow: 0 8px 18px -8px rgba(59,91,219,0.55), inset 0 1px 0 rgba(255,255,255,0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button.primary:active { transform: scale(0.97); filter: brightness(0.96); }
  button.ghost {
    background: var(--glass-strong); color: var(--accent);
    border: 1px solid var(--glass-border); border-radius: 999px; padding: 10px 18px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--sans);
    backdrop-filter: var(--blur-lite); -webkit-backdrop-filter: var(--blur-lite);
    box-shadow: var(--shadow-soft), var(--specular);
  }
  button.ghost.on { border-color: rgba(18,133,95,0.4); color: var(--ok); }
  button.danger-link { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; font-family: var(--sans); }

  .duty-card { position: relative; overflow: hidden; }
  .duty-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--edge, var(--accent));
    border-radius: 4px 0 0 4px;
  }
  .duty-card .when { color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .duty-card .what { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .duty-card .role { display: flex; align-items: center; gap: 9px; margin-top: 6px; font-size: 15px; font-weight: 600; }
  .duty-card .role .rname { flex: 1; }
  .duty-card .role .req-change { font-size: 12.5px; font-weight: 600; padding: 2px 0; white-space: nowrap; }
  .duty-card .role .req-pending-tag { flex: 0 0 auto; }
  .duty-card .svc-sep { border-top: 1px solid var(--hairline); margin: 14px 0 10px; }
  .duty-expand { margin-top: 12px; border-top: 1px solid var(--hairline); padding-top: 8px; }

  .alert-item { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
  .alert-item:last-child { border-bottom: none; }
  .alert-item .t { color: var(--faint); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- change requests ---------- */
  .req-pending-tag { font-size: 12px; color: var(--muted); font-style: italic; }
  .req-form { margin-top: 10px; border-top: 1px solid var(--hairline); padding-top: 10px; }
  .req-form textarea {
    width: 100%; min-height: 64px; padding: 10px 12px; resize: vertical;
    border: 1px solid var(--line); border-radius: 13px; font-size: 15px; font-family: var(--sans);
    background: var(--glass-strong); color: var(--ink); outline: none;
  }
  .req-form textarea:focus { border-color: rgba(59,91,219,0.5); box-shadow: 0 0 0 3px rgba(59,91,219,0.14); }
  .req-form .req-actions { display: flex; gap: 8px; margin-top: 8px; }
  .status-chip {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 10px; border-radius: 999px;
  }
  .status-chip.pending { background: rgba(173,106,18,0.14); color: var(--warn); }
  .status-chip.approved { background: rgba(18,133,95,0.14); color: var(--ok); }
  .status-chip.declined { background: rgba(209,51,43,0.12); color: var(--danger); }
  .req-item { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .req-item:last-child { border-bottom: none; }
  .req-item .req-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .req-item .req-when { font-size: 13px; font-weight: 600; }
  .req-item .req-note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .req-item .req-meta { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .req-card .req-item { display: flex; flex-direction: column; }
  .req-actions-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  /* ---------- manage ---------- */
  .subnav { display: flex; gap: 6px; margin: 18px 0; flex-wrap: wrap; align-items: center; }
  .subnav button {
    border: 1px solid var(--glass-border); background: var(--glass-strong);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 600;
    color: var(--muted); cursor: pointer; font-family: var(--sans);
    backdrop-filter: var(--blur-lite); -webkit-backdrop-filter: var(--blur-lite);
    box-shadow: var(--specular);
  }
  .subnav button.active { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 4px 12px -4px rgba(59,91,219,0.5); }
  .subnav .lock-btn { margin-left: auto; }
  .subnav.chips button { display: inline-flex; align-items: center; gap: 6px; }

  form.add-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  form.add-row input, form.add-row select { flex: 1; min-width: 105px; }

  .edit-grid { display: grid; grid-template-columns: 132px 1fr; gap: 7px 12px; align-items: center; margin: 8px 0; }
  .edit-grid .lab { font-size: 13px; color: var(--muted); text-align: right; }
  .edit-grid select, .edit-grid input { padding: 8px 11px; font-size: 15px; border-radius: 11px; }
  .cat-edit-label { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin: 18px 0 4px; }

  .list-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: var(--blur-lite); -webkit-backdrop-filter: var(--blur-lite);
    border-radius: var(--r-md); padding: 9px 14px; margin-bottom: 8px;
    box-shadow: var(--shadow-soft), var(--specular);
  }
  .list-row input[type=text] { border: none; background: none; padding: 4px 2px; font-weight: 600; font-size: 15px; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .list-row input[type=text]:focus { box-shadow: none; outline: 1px solid rgba(59,91,219,0.4); border-radius: 6px; }
  .list-row .count { color: var(--faint); font-size: 12px; white-space: nowrap; }

  .data-actions .card p { margin: 0 0 10px; font-size: 15px; color: var(--muted); }
  .data-actions .card p b { color: var(--ink); }
  code.cfg { display: block; background: rgba(60,60,67,0.06); border-radius: 11px; padding: 8px 12px; font-size: 12px; overflow-x: auto; }
  .sync-status { font-size: 13px; color: var(--muted); }
  .sync-warnings { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

  /* ---------- lock screen ---------- */
  .lock-box { text-align: center; padding: 34px 26px; margin-top: 22px; }
  .lock-title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 2px; }
  .lock-box .hint { margin: 6px auto 18px; max-width: 380px; }
  .lock-box form { justify-content: center; max-width: 360px; margin: 0 auto; }
  .pin-error { color: var(--danger); font-size: 13px; font-weight: 600; margin: 10px 0 0; }

  /* ---------- feature toggles (iOS switch 51x31, 27px knob) ---------- */
  .feature-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 20px; }
  .f-label { font-weight: 600; font-size: 15px; }
  .f-desc { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .switch { position: relative; flex: 0 0 auto; display: inline-block; width: 51px; height: 31px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(120,120,128,0.32);
    transition: background 0.25s ease;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.16);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- phone: floating glass bottom tab bar ---------- */
  @media (max-width: 640px) {
    .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    header.app { padding-top: 34px; }
    nav.tabs {
      position: fixed;
      top: auto;
      left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom));
      margin: 0;
      max-width: 560px;
      margin-left: auto; margin-right: auto;
      padding: 6px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: saturate(180%) blur(34px); -webkit-backdrop-filter: saturate(180%) blur(34px);
      box-shadow: var(--shadow-bar), var(--specular);
    }
    nav.tabs button { padding: 11px 4px; font-size: 15px; }
    nav.tabs button .dot { top: 8px; right: 18px; }
  }

  /* Song picker sub-view: the "← My Duties" back-button row above #song-root. */
  .song-head { margin: 14px 0 2px; }
  .song-head .ghost { padding: 8px 16px; font-size: 14px; }
</style>
<link rel="stylesheet" href="song-app.css">
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="eyebrow">Las Vegas Zion</div>
    <h1>Worship Duty Schedule</h1>
    <div class="sub"><span id="sync-pill" class="sync-pill">This device only</span></div>
  </header>

  <nav class="tabs">
    <button data-act="tab" data-tab="schedule">Schedule</button>
    <button data-act="tab" data-tab="my" id="tab-my">My Duties</button>
    <button data-act="tab" data-tab="manage" id="tab-manage">Manage</button>
  </nav>

  <div id="banners" aria-live="polite"></div>
  <main id="view"></main>
</div>
<script src="seed-data.js"></script>
<script src="song-seed.js"></script>
<script src="song-lib.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
